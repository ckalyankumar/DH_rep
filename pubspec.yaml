name: dhealth
description: "DHealth — Skin health companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5

  # Core
  cupertino_icons: ^1.0.2
  intl: ^0.18.1

  # Firebase (UPDATED - Compatible Versions)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.1.1
  firebase_storage: ^12.0.4
  firebase_analytics: ^11.1.0

  # Location & Weather
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  http: ^1.2.0

  # UI & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^25.1.35
  table_calendar: ^3.0.9

  # Local notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.0
  flutter_timezone: ^4.0.0
  permission_handler: ^11.3.1

  # Data Management
  flutter_riverpod: ^2.6.0
  riverpod: ^2.6.0
  workmanager: ^0.6.0
  shared_preferences: ^2.2.2

  # PDF & Reports
  pdf: ^3.11.1
  path_provider: ^2.1.0

  # Calendar export (optional)
  add_2_calendar: ^2.1.2

  # Environment
  flutter_dotenv: ^6.0.0
  package_info_plus: ^8.0.0

  crypto: any
  uuid: any
  web: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  json_serializable: ^6.8.0
  fake_cloud_firestore: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env
